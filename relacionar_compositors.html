<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Teatre de la Banda · Escape Room de la Nit</title>
<link rel="stylesheet" href="comu.css?v=2">
<style>
    /* ---------- Escenari del teatre ---------- */
    .j-h1 { font-size: clamp(1.7rem, 6vw, 2.6rem); }
    .j-intro { margin-bottom: 1rem; }
    .estrelles { color: var(--or); letter-spacing: .1em; }

    .escenari {
        position: relative; overflow: hidden; border-radius: 20px; padding: 26px 12px 12px;
        border: 1px solid var(--vora);
        background:
            radial-gradient(60% 55% at 50% 0%, rgba(255, 207, 92, .28), transparent 70%),
            linear-gradient(180deg, #3b1530 0%, #24102f 52%, #4a2a14 52%, #3a2010 100%);
    }
    /* Cenefa vermella del teló */
    .escenari::before {
        content: ''; position: absolute; left: 0; right: 0; top: 0; height: 22px; z-index: 2;
        background: radial-gradient(circle at 50% 0, #b3202e 14px, transparent 15px) 0 6px / 30px 22px repeat-x, #8c1622;
        box-shadow: 0 4px 10px rgba(0, 0, 0, .5);
    }
    /* Taulons de l'escenari */
    .escenari::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: 0; top: 52%; pointer-events: none;
        background: repeating-linear-gradient(90deg, transparent 0 58px, rgba(0, 0, 0, .25) 58px 60px);
    }
    .telo {
        position: absolute; top: 0; bottom: 0; width: 12%; z-index: 1; pointer-events: none;
        background: repeating-linear-gradient(90deg, #a01a28 0 10px, #7a1220 10px 20px);
        box-shadow: inset -8px 0 14px rgba(0, 0, 0, .4);
    }
    .telo.e { left: 0; border-radius: 0 0 60% 0; }
    .telo.d { right: 0; border-radius: 0 0 0 60%; transform: scaleX(-1); }

    .bastidors { position: relative; z-index: 3; display: grid; justify-items: center; gap: 8px; min-height: 190px; }
    .paciencia { width: min(240px, 70%); }
    .paciencia small { display: block; text-align: center; font-size: .72rem; font-weight: 800; letter-spacing: .08em; color: var(--suau); margin-bottom: 3px; }
    .paciencia .barra { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .12); overflow: hidden; }
    .paciencia .barra i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--verd), var(--or)); }
    .paciencia.alerta .barra i { background: var(--vermell); }
    .paciencia.alerta small { color: var(--vermell); }
    .forat { min-height: 140px; display: grid; place-items: center; }

    /* ---------- Targetes d'instrument ---------- */
    .targeta {
        position: relative; width: 116px; padding: 10px 8px 8px; border-radius: 16px; text-align: center;
        background: var(--paper); color: var(--tinta); border: 3px solid #e2c48f;
        box-shadow: 0 10px 22px -8px rgba(0, 0, 0, .8), inset 0 0 18px rgba(139, 90, 43, .25);
        display: grid; justify-items: center; gap: 4px; user-select: none; -webkit-user-select: none;
    }
    .targeta b { font-weight: 800; font-size: .92rem; line-height: 1.15; }
    .targeta .ico { font-size: 3rem; line-height: 1; height: 60px; display: grid; place-items: center; }
    .targeta .ico svg { width: 58px; height: 58px; }
    .targeta .ico.gran svg { width: 66px; height: 66px; }
    .forat .targeta { touch-action: none; cursor: grab; z-index: 5; }
    .forat .targeta.arrossega { cursor: grabbing; z-index: 30; box-shadow: 0 24px 40px -10px rgba(0, 0, 0, .9); }
    .forat .targeta.triada { border-color: var(--or); box-shadow: 0 0 0 4px rgba(255, 207, 92, .45), 0 14px 30px -8px rgba(0, 0, 0, .8); transform: translateY(-6px); }
    .targeta.cau { animation: cau .55s cubic-bezier(.3, 1.3, .5, 1); }
    @keyframes cau { from { transform: translateY(-150px) rotate(-16deg); opacity: 0; } 60% { opacity: 1; } }

    /* ---------- Caixes de família ---------- */
    .families { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
    .caixa {
        position: relative; min-height: 132px; padding: 10px 6px 8px; border-radius: 16px; text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        background: linear-gradient(180deg, rgba(20, 11, 38, .55), rgba(20, 11, 38, .8));
        border: 2px dashed var(--c); transition: transform .15s, background .15s, box-shadow .15s;
    }
    .caixa:hover, .caixa.sobre { background: rgba(20, 11, 38, .9); transform: translateY(-3px); box-shadow: 0 0 0 3px var(--c), 0 0 26px -4px var(--c); border-style: solid; }
    .families.esperant .caixa { animation: crida 1s infinite alternate; }
    @keyframes crida { to { box-shadow: 0 0 0 2px var(--c), 0 0 22px -6px var(--c); } }
    .caixa kbd { position: absolute; top: 6px; left: 8px; font: 800 .7rem var(--f-text); color: var(--suau); opacity: .7; }
    .caixa .cx-ico { font-size: 1.6rem; }
    .caixa b { font-family: var(--f-titol); font-weight: 400; font-size: 1.08rem; color: var(--c); line-height: 1.1; }
    .caixa small { font-size: .7rem; color: var(--suau); line-height: 1.2; }
    .caixa .dins { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 4px; }
    .caixa .dins span { width: 26px; height: 26px; display: grid; place-items: center; font-size: 1.15rem; animation: j-pop .3s; }
    .caixa .dins svg { width: 24px; height: 24px; }

    /* ---------- Part 2: l'intrús ---------- */
    .intrus .consigna { text-align: center; font-weight: 700; color: var(--suau); margin-bottom: .8rem; }
    .intrus .consigna b { color: var(--or); }
    .grup { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; justify-items: center; margin-bottom: 1rem; }
    .grup .targeta { width: 100%; max-width: 150px; cursor: pointer; transition: transform .15s, opacity .3s, border-color .2s; }
    .grup .targeta:hover:not(:disabled) { transform: translateY(-4px) rotate(-1deg); border-color: var(--carbassa); }
    .grup .targeta.be { border-color: var(--verd); box-shadow: 0 0 0 4px rgba(111, 220, 140, .5), 0 0 30px rgba(111, 220, 140, .5); transform: scale(1.05); }
    .grup .targeta.malament { border-color: var(--vermell); animation: j-tremola .4s; opacity: .55; }
    .grup .targeta.apaga { opacity: .35; filter: grayscale(.6); }
    .grup .targeta:disabled { cursor: default; }
    .motius { grid-template-columns: 1fr; max-width: 560px; margin: 0 auto; }
    .motius .j-opcio { text-align: left; font-size: .98rem; line-height: 1.35; }
    .motius .j-opcio::before { content: '🎟️ '; }
    .pregunta-motiu { text-align: center; font-weight: 800; margin-bottom: .6rem; }
    .seguent { display: flex; justify-content: center; margin-top: 1rem; }

    /* ---------- Final: la banda sona ---------- */
    .concert { text-align: center; padding: 2rem 1rem; }
    .concert .musics { font-size: 3rem; display: flex; justify-content: center; flex-wrap: wrap; gap: .6rem; }
    .concert .musics span { display: inline-block; animation: balla .5s infinite alternate ease-in-out; }
    .concert .musics span:nth-child(2n) { animation-delay: .25s; }
    @keyframes balla { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-14px) rotate(6deg); } }
    .concert p { font-family: var(--f-titol); font-size: 1.6rem; color: var(--or); margin-top: 1rem; }
    .llibre { font-size: 2.4rem; display: inline-block; animation: vola 3s ease-in-out forwards; }
    @keyframes vola { from { transform: translate(-40vw, 30px) rotate(-20deg); } to { transform: translate(40vw, -60px) rotate(20deg); opacity: 0; } }

    @media (max-width: 560px) {
        .families { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .caixa { min-height: 104px; }
        .caixa kbd { display: none; }
        .grup { grid-template-columns: repeat(2, 1fr); }
        .telo { width: 7%; }
        .bastidors { min-height: 176px; }
    }
</style>
</head>
<body>
<main class="j-main">
    <section class="j-panell">
        <h1 class="j-h1">El Teatre de la Banda</h1>
        <p class="j-intro" id="consigna">Porta cada instrument a la seva <b>família</b>: arrossega'l o toca'l i després toca la caixa.</p>
        <div class="j-hud" aria-live="polite">
            <span class="j-xip" id="hFase">🎭 Part 1/2</span>
            <span class="j-xip" id="hComp">🎵 0/12</span>
            <span class="j-xip" id="hRatxa">🔥 0</span>
            <span class="j-xip" id="hOv">👏 0</span>
            <span class="j-xip" id="hVides" aria-label="Vides"></span>
        </div>
        <div class="j-progres"><i id="barra"></i></div>
        <div id="escena"></div>
    </section>
</main>

<script src="comu.js?v=2"></script>

// Tria 5 rondes: 1 de corda, 1 de percussió i 3 més a l'atzar; comença per una de 'familia' (la més fàcil)
function triaRondes() {
    const de = t => Joc.barreja(BANC_RONDES.filter(r => r.tema === t));
    const base = [de('familia')[0], de('corda')[0], de('perc')[0]];
    const resta = Joc.barreja(BANC_RONDES.filter(r => !base.includes(r))).slice(0, N_RONDES - base.length);
    return [base[0], ...Joc.barreja([...base.slice(1), ...resta])];
}

// ---------- Estat i puntuació ----------
// 3 vides: cada errada (família equivocada, paciència esgotada, intrús o motiu equivocat) en gasta una.
// A la 4a errada, el bruixot us atrapa (Joc.fracas) i el repte torna a començar amb instruments nous.
const N_CLASS = 12, N_RONDES = 5, TOTAL = N_CLASS + N_RONDES * 2, VIDES = 3;
const estrelles = errades => Math.max(1, VIDES - errades);
let E;
let families, forat, pac;
// Pausa (pista o diàleg obert): el temps s'atura i no es pot jugar
const pausat = () => !!(Joc.enPausa && Joc.enPausa());

function hud() {
    const queden = Math.max(0, VIDES - E.errades);
    $('#hFase').textContent = `🎭 Part ${E.fase}/2`;
    $('#hComp').textContent = E.fase === 1 ? `🎵 ${Math.min(E.i, N_CLASS)}/${N_CLASS}` : `🔎 Ronda ${Math.min(E.r + 1, N_RONDES)}/${N_RONDES}`;
    $('#hRatxa').textContent = `🔥 ${E.ratxa}`;
    $('#hOv').textContent = `👏 ${E.encerts}`;
    // Vides: carbasses il·lustrades (les perdudes, apagades)
    $('#hVides').innerHTML = Array.from({ length: VIDES }, (_, n) => Joc.icona('carbassa', 22, n < queden ? '' : 'apagada')).join('');
    $('#hVides').setAttribute('aria-label', `Vides: ${queden} de ${VIDES}`);
    $('#hVides').classList.toggle('alerta', queden === 0);
    const fet = E.fase === 1 ? E.i : N_CLASS + E.r * 2;
    $('#barra').style.width = (fet / TOTAL * 100) + '%';
}

// Encert a la primera: suma ovacions i ratxa, amb reaccions del públic
function encert() {
    E.encerts++; E.ratxa++; E.millor = Math.max(E.millor, E.ratxa);
    if (E.ratxa === 3) Joc.diu('marrameu', 'Tres seguits! El públic comença a picar de mans 👏');
    else if (E.ratxa === 5) Joc.diu('marrameu', 'Cinc seguits! Miau-gnífic! 👏👏');
    else if (E.ratxa === 8) Joc.diu('castanyera', 'Vuit seguits! Sembles el director de la banda, bonic!');
    else if (E.ratxa === 12) Joc.diu('marrameu', 'DOTZE! Ovació dempeus! 👏👏👏');
}
// Errada: gasta una vida. Retorna true si ja no en queden (i llança el fracàs).
function perdVida(motiu) {
    E.errades++; E.ratxa = 0;
    hud();
    Joc.reinicia($('#hVides'), 'j-tremola');
    if (E.errades > VIDES) { atrapats(motiu); return true; }
    Joc.toast(E.errades === VIDES ? '🍅 Cap vida més: la propera errada, el bruixot us atrapa!' : `🍅 Xiulet del públic! Queden ${VIDES - E.errades} vides`, 'malament');
    return false;
}
function atrapats(motiu) {
    E.bloc = true; E.actual = null; E.fase = 0;
    cancelAnimationFrame(E.raf);
    Joc.fracas({ motiu, reinicia: comenca });
}

// So característic de cada família en encertar
function soFamilia(f) {
    const t = Joc.so.ara();
    if (f === 'corda') { Joc.so.nota(67, { t, dur: .9, vol: .16 }); Joc.so.nota(71, { t: t + .08, dur: .8, vol: .12 }); }
    else if (f === 'fusta') { Joc.so.nota(76, { t, dur: .6, vol: .14 }); Joc.so.nota(79, { t: t + .12, dur: .6, vol: .12 }); }
    else if (f === 'metall') { Joc.so.nota(60, { t, dur: .5, vol: .18 }); Joc.so.nota(67, { t: t + .1, dur: .7, vol: .16 }); }
    else { Joc.so.cop('bombo', t); Joc.so.cop('caixa', t + .15); Joc.so.cop('charles', t + .3); }
}

// ================= PART 1: CLASSIFICAR =================
// Casos "trampa" (el material o les tecles enganyen): cada partida n'inclou 3
const TRAMPES = ['saxo', 'flauta', 'flauti', 'cornAngles', 'piano', 'clavicembal', 'xilofon', 'marimba', 'metallofon', 'campanes', 'triangle', 'castanyoles', 'plats'];
function triaInstruments() {
    const de = f => Object.keys(INSTR).filter(k => INSTR[k].f === f);
    const trampes = Joc.barreja(TRAMPES).slice(0, 3);
    let llista = [];
    ORDRE.forEach(f => {
        const fixos = trampes.filter(k => INSTR[k].f === f);
        llista.push(...[...fixos, ...Joc.barreja(de(f).filter(k => !fixos.includes(k)))].slice(0, 3));
    });
    // Les trampes mai surten de primeres
    do { llista = Joc.barreja(llista); } while (TRAMPES.includes(llista[0]) || TRAMPES.includes(llista[1]));
    return llista;
}

    const k = E.llista[E.i], ins = INSTR[k];
    E.actual = k; E.fallat = false; E.bloc = false;
    const c = document.createElement('div');
    c.className = 'targeta cau'; c.tabIndex = 0; c.setAttribute('role', 'button');
    c.setAttribute('aria-label', `${ins.nom}. Tria la família amb les tecles 1 a 4.`);
    c.innerHTML = `${icona(k)}<b>${ins.nom}</b>`;
    c._dx = c._dy = 0;
    forat.replaceChildren(c);
    lligaDrag(c);
    E.durada = Math.max(7000, 12000 - E.i * 400); // cada cop menys paciència
    E.fi = performance.now() + E.durada;
    rellotge();
    hud();
}

// Barra de paciència: es buida; si arriba a zero, el públic s'impacienta
function rellotge() {
    cancelAnimationFrame(E.raf);
    let abans = performance.now();
    const pas = ara => {
        if (E.fase !== 1 || !E.actual) return;
        const dt = ara - abans; abans = ara;
        if (E.bloc || pausat()) E.fi += dt; // aturat mentre hi ha animacions o el joc està en pausa
        const queda = E.fi - ara;
        pac.style.width = Math.max(0, queda / E.durada * 100) + '%';
        $('#pacEl').classList.toggle('alerta', queda < 3000);
        if (queda <= 0 && !E.drag && !E.bloc && !pausat()) return tempsEsgotat();
        E.raf = requestAnimationFrame(pas);
    };
    E.raf = requestAnimationFrame(pas);
}

const caixaSota = (x, y) => [...families.children].find(b => {
    const r = b.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}) || null;
function ressalta(caixa) { [...families.children].forEach(b => b.classList.toggle('sobre', b === caixa)); }
function treuSeleccio() {
    const c = forat && forat.firstElementChild;
    if (c) c.classList.remove('triada');
    families && families.classList.remove('esperant');
}
function commutaSeleccio(c) {
    if (E.bloc || pausat()) return;
    Joc.so.clic();
    const on = !c.classList.contains('triada');
    c.classList.toggle('triada', on);
    families.classList.toggle('esperant', on);
}

// Arrossegar amb pointer events (ratolí i tàctil). Un toc sense moure = seleccionar.
function lligaDrag(c) {
    c.addEventListener('pointerdown', e => {
        if (E.bloc || pausat() || e.button > 0) return;
        e.preventDefault();
        try { c.setPointerCapture(e.pointerId); } catch (err) {}
        E.drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, mogut: false };
        c.style.transition = 'none';
    });
    c.addEventListener('pointermove', e => {
        const d = E.drag; if (!d || d.id !== e.pointerId) return;
        if (!d.mogut && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 8) {
            d.mogut = true; treuSeleccio(); c.classList.remove('cau', 'j-tremola'); c.classList.add('arrossega');
        }
        if (!d.mogut) return;
        c._dx = e.clientX - d.sx; c._dy = e.clientY - d.sy;
        const gir = Math.max(-12, Math.min(12, c._dx / 18));
        c.style.transform = `translate(${c._dx}px, ${c._dy}px) rotate(${gir}deg) scale(1.05)`;
        ressalta(caixaSota(e.clientX, e.clientY));
    });
    const deixa = (e, cancel) => {
        const d = E.drag; if (!d || d.id !== e.pointerId) return;
        E.drag = null; c.classList.remove('arrossega'); ressalta(null);
        if (!d.mogut) { if (!cancel) commutaSeleccio(c); return; }
        const caixa = cancel ? null : caixaSota(e.clientX, e.clientY);
        if (caixa && !pausat()) colloca(caixa.dataset.f); else rebota(c, false);
    };
    c.addEventListener('pointerup', e => deixa(e, false));
    c.addEventListener('pointercancel', e => deixa(e, true));
    c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); commutaSeleccio(c); } });
}

// La targeta torna al seu lloc (amb tremolor si ha estat un error)
function rebota(c, error = true) {
    c.style.transition = 'transform .5s cubic-bezier(.3, 1.6, .5, 1)';
    c.style.transform = '';
    c._dx = c._dy = 0;
    if (error) setTimeout(() => { c.style.transition = ''; Joc.reinicia(c, 'j-tremola'); }, 480);
}
// La targeta vola dins la caixa
function vola(c, caixa) {
    const a = c.getBoundingClientRect(), b = caixa.getBoundingClientRect();
    const dx = b.left + b.width / 2 - (a.left + a.width / 2) + (c._dx || 0);
    const dy = b.top + b.height / 2 - (a.top + a.height / 2) + (c._dy || 0);
    c.classList.remove('cau', 'j-tremola');
    c.style.transition = 'transform .45s cubic-bezier(.5, 0, .7, 1), opacity .45s';
    c.style.transform = `translate(${dx}px, ${dy}px) scale(.2) rotate(20deg)`;
    c.style.opacity = '0';
}
function guardaACaixa(k, caixa) {
    const s = document.createElement('span');
    s.title = INSTR[k].nom; s.innerHTML = iconaMini(k);
    caixa.querySelector('.dins').appendChild(s);
    Joc.reinicia(caixa, 'j-pop');
}

async function colloca(f) {
    if (E.bloc || pausat() || !E.actual || E.fase !== 1) return;
    const k = E.actual, ins = INSTR[k], c = forat.firstElementChild;
    const caixa = families.querySelector(`[data-f="${f}"]`);
    treuSeleccio();
    if (f === ins.f) {
        E.bloc = true;
        if (!E.fallat) encert();
        soFamilia(f);
        vola(c, caixa);
        Joc.toast(`✔ ${ins.nom}: ${ins.sub}`, 'be');
        await Joc.espera(430);
        guardaACaixa(k, caixa);
        seguent();
    } else {
        // L'instrument rebota i s'ha de tornar a col·locar (no es salta mai)
        E.fallat = true;
        Joc.so.malament();
        rebota(c);
        Joc.reinicia(caixa, 'j-tremola');
        Joc.diu('marrameu', `Miau-ui! No és <b>${FAM[f].nom}</b>. ${(ins.err && ins.err[f]) || ins.per}`, 5200);
        if (perdVida('Massa instruments a la família equivocada: el públic us ha xiulat fins que el bruixot us ha atrapat entre bastidors!')) return;
        E.fi = Math.max(E.fi, performance.now() + 2500); // marge per tornar-ho a provar
    }
    hud();
}

// Paciència esgotada: gasta una vida, però l'instrument es queda fins que es col·loqui bé
function tempsEsgotat() {
    const ins = INSTR[E.actual];
    E.fallat = true;
    Joc.so.malament();
    Joc.reinicia(forat.firstElementChild, 'j-tremola');
    Joc.diu('marrameu', `El públic s’impacienta i xiula! Pista: ${ins.per}`, 5200);
    if (perdVida('El públic s’ha cansat d’esperar... i el bruixot us ha atrapat entre bastidors!')) return;
    E.fi = performance.now() + E.durada;
    rellotge();
}

function seguent() {
    E.i++; E.actual = null;
    hud();
    if (E.i >= N_CLASS) return fiFase1();
    if (E.i === N_CLASS / 2) Joc.diu('castanyera', 'Ja teniu mitja banda asseguda, bonics! Seguiu així!');
    novaCarta();
}

async function fiFase1() {
    cancelAnimationFrame(E.raf);
    E.bloc = true;
    $('#pacEl').style.visibility = 'hidden';
    soFamilia('corda'); await Joc.espera(250); soFamilia('metall');
    await Joc.espera(900);
    await Joc.dialeg([
        { qui: 'marrameu', text: `Tota la banda asseguda! <b>${E.encerts} de ${N_CLASS}</b> a la primera. Però l’esternut ha colat <b>intrusos</b> dins dels grups...` },
        { qui: 'marrameu', text: 'En cada grup de quatre n’hi ha un que no encaixa. Toca l’<b>intrús</b> i després tria <b>per què</b>. Cada intrús o motiu equivocat també gasta una vida!' },
    ], { boto: 'A buscar intrusos!' });
    E.fase = 2; E.r = 0;
    muntaFase2();
}

// ================= PART 2: L'INTRÚS =================
function muntaFase2() {
    $('#consigna').innerHTML = 'Troba l’<b>intrús</b> de cada grup i explica <b>per què</b> no encaixa.';
    escena.innerHTML = `
        <div class="intrus">
            <p class="consigna" id="cons"></p>
            <div class="grup" id="grup"></div>
            <div id="zonaMotius"></div>
        </div>`;
    $('#grup').addEventListener('click', e => {
        const b = e.target.closest('.targeta');
        if (b && !b.disabled) triaIntrus(b);
    });
    ronda();
}

function ronda() {
    const R = E.rondes[E.r];
    E.fallatIntrus = false; E.fallatMotiu = false; E.bloc = false;
    $('#cons').innerHTML = `Ronda ${E.r + 1} de ${N_RONDES} · Quin és l’<b>intrús</b>?`;
    $('#grup').innerHTML = Joc.barreja(R.inst).map(k =>
        `<button class="targeta j-entra" data-k="${k}">${icona(k)}<b>${INSTR[k].nom}</b></button>`).join('');
    $('#zonaMotius').innerHTML = '';
    hud();
}

function triaIntrus(b) {
    if (E.bloc || pausat()) return;
    const R = E.rondes[E.r];
    if (b.dataset.k === R.intrus) {
        E.bloc = true;
        if (!E.fallatIntrus) encert();
        Joc.so.be();
        b.classList.add('be');
        $('#grup').querySelectorAll('.targeta').forEach(t => { t.disabled = true; if (t !== b) t.classList.add('apaga'); });
        mostraMotius(R);
    } else {
        E.fallatIntrus = true;
        Joc.so.malament();
        b.classList.add('malament'); b.disabled = true;
        Joc.diu('marrameu', `Miau-no! No és <b>${INSTR[b.dataset.k].nom}</b>. Pista: ${R.pista}`, 4500);
        if (perdVida('Massa intrusos equivocats: el bruixot us ha atrapat entre les butaques!')) return;
    }
    hud();
}

function mostraMotius(R) {
    const z = $('#zonaMotius');
    z.innerHTML = `<p class="pregunta-motiu j-entra">Per què l’intrús és <b>${INSTR[R.intrus].nom}</b>?</p>
        <div class="j-opcions motius j-entra">${Joc.barreja(R.motius).map(m => `<button class="j-opcio" data-ok="${m === R.motius[0] ? 1 : 0}">${m}</button>`).join('')}</div>`;
    z.querySelector('.motius').addEventListener('click', e => {
        const b = e.target.closest('.j-opcio');
        if (b && !b.disabled) triaMotiu(b, R);
    });
    E.bloc = false; // les targetes ja estan desactivades: ara es poden triar motius
}

// Cal encertar el motiu: si falla, gasta una vida i es torna a triar (no es passa mai sense encertar)
async function triaMotiu(b, R) {
    if (E.bloc || pausat()) return;
    const ok = b.dataset.ok === '1';
    const extra = R.explica || INSTR[R.intrus].per;
    if (ok) {
        E.bloc = true;
        $('#zonaMotius').querySelectorAll('.j-opcio').forEach(o => { o.disabled = true; });
        if (!E.fallatMotiu) encert();
        Joc.so.be(); b.classList.add('be');
        Joc.toast('✔ Exacte! ' + extra, 'be');
        hud();
        await Joc.espera(1900);
        seguentRonda();
    } else {
        E.fallatMotiu = true;
        Joc.so.malament(); b.classList.add('malament'); b.disabled = true;
        Joc.diu('marrameu', 'Aquest motiu no és correcte. Pensa en <b>com es produeix el so</b>!', 4000);
        perdVida('Massa motius equivocats: el bruixot us ha atrapat entre les butaques!');
    }
}

function seguentRonda() {
    E.r++;
    if (E.r === 3) Joc.diu('castanyera', 'Només en queden dues! Teniu una orella d’or!');
    if (E.r >= N_RONDES) { hud(); return fiJoc(); }
    ronda();
}

// ================= FINAL =================
function tocaBanda() {
    const t0 = Joc.so.ara() + .1, b = .42;
    const acords = [[48, 60, 64, 67], [53, 57, 60, 65], [55, 59, 62, 67], [48, 60, 64, 72]];
    acords.forEach((a, i) => {
        a.forEach(m => Joc.so.nota(m, { t: t0 + i * b * 2, dur: 1, vol: .1 }));
        Joc.so.cop('bombo', t0 + i * b * 2);
        Joc.so.cop('charles', t0 + i * b * 2 + b, .8);
    });
    [72, 74, 76, 77, 79, 77, 74, 72].forEach((m, i) => Joc.so.nota(m, { t: t0 + i * b, dur: .4, vol: .12 }));
}

async function fiJoc() {
    E.bloc = true;
    const est = estrelles(E.errades);
    // La banda torna a sonar
    escena.innerHTML = `<div class="concert j-entra">
        <div class="musics" aria-hidden="true"><span>🎻</span><span>🎷</span><span>🎺</span><span>🥁</span><span>🎹</span><span>🎸</span></div>
        <p>La banda torna a sonar!</p>
        <div class="llibre" aria-hidden="true">📖</div>
    </div>`;
    tocaBanda();
    await Joc.espera(3600);
    Joc.guanya({
        repte: 5,
        missatge: `<span class="estrelles" style="font-size:1.6rem">${'★'.repeat(est)}${'☆'.repeat(3 - est)}</span><br><b>${E.encerts} de ${TOTAL}</b> encerts a la primera · ${E.errades} errades · millor ratxa: ${E.millor}`,
        resum: 'Recorda: la família depèn de <b>com es produeix el so</b>, no del material. Per això el saxòfon i la flauta travessera són vent fusta, i el piano és corda percudida.',
        epileg: [
            { qui: 'marrameu', text: 'Escolteu! La banda torna a sonar... i el públic aplaudeix dempeus! <b>Miau-ravellós!</b>' },
            { qui: 'castanyera', text: 'Mireu allà dalt! Un <b>llibre volador</b> ha sortit de darrere el teló i se’n va volant cap a la <b>Biblioteca del Bruixot</b>.' },
            { qui: 'marrameu', text: 'Segur que hi ha un altre tros de la Melodia! Seguim-lo: <b>Repte VI, la Biblioteca del Bruixot</b>.' },
        ],
    });
}

function comenca() {
    cancelAnimationFrame(E && E.raf);
    E = {
        fase: 1, llista: triaInstruments(), i: 0, actual: null, fallat: false, bloc: false, drag: null,
        encerts: 0, errades: 0, ratxa: 0, millor: 0, raf: 0, fi: 0, durada: 10000,
        rondes: triaRondes(), r: 0, fallatIntrus: false, fallatMotiu: false,
    };
    muntaFase1();
    hud();
}

// Teclat: 1–4 envien la targeta a una família
document.addEventListener('keydown', e => {
    if (!E || E.fase !== 1 || pausat() || document.querySelector('.j-dialeg')) return;
    const n = ['1', '2', '3', '4'].indexOf(e.key);
    if (n >= 0) colloca(ORDRE[n]);
});

// ---------- Inici ----------
(async () => {
    E = { fase: 1, i: 0, r: 0, encerts: 0, errades: 0, ratxa: 0 };
    hud();
    await Joc.dialeg([
        { qui: 'marrameu', text: 'Benvinguts al <b>Teatre de la Banda</b>! Cada nit de Castanyada hi ha concert... però avui l’escenari és un desgavell miau-núscul.' },
        { qui: 'castanyera', text: 'L’esternut del bruixot ho ha fet volar tot, fills meus! Els instruments cauen del sostre tots barrejats.' },
        { qui: 'marrameu', text: 'Porta cada instrument a la seva <b>família</b>: <b>Corda</b>, <b>Vent fusta</b>, <b>Vent metall</b> o <b>Percussió</b>. Arrossega’l, o toca’l i després toca la caixa. Si el poses malament, rebotarà fins que l’encertis.' },
        { qui: 'marrameu', text: 'Després caçarem <b>intrusos</b>. Però compte: el públic només us perdona <b>3 errades</b> 🎃🎃🎃 (i si se li acaba la paciència, també compta). A la quarta... el bruixot us atrapa i tornem a començar!' },
    ], { boto: 'Que comenci la funció!' });
    comenca();
})();
</script>
